name: Deploy Q-CHEM Lab to Pages

on:
  push:
    branches: [main]
    paths:
      - "qchem-lab/**"
      - ".github/workflows/qchem-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: qchem-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: qchem-lab/package-lock.json

      - name: Install frontend dependencies
        working-directory: qchem-lab
        run: npm ci

      - name: Test frontend
        working-directory: qchem-lab
        run: npm test -- --run

      - name: Build Pages artifact
        working-directory: qchem-lab
        env:
          VITE_BASE_PATH: /quantum-ald-simulation/
          VITE_CHEMISTRY_API_BASE_URL: ${{ vars.QCHEM_API_BASE_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: qchem-lab/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
