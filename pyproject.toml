[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-ald-simulation"
version = "0.1.0"
description = "Hybrid quantum-classical simulation workflow for Atomic Layer Deposition reactions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Karim El Houdaigui" }]
keywords = ["quantum", "chemistry", "ALD", "VQE", "HPC", "PySCF", "Qiskit"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.23.0",
  "scipy>=1.9.0",
  "matplotlib>=3.5.0",
  "pandas>=1.5.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "black", "flake8", "mypy"]
chemistry = ["pyscf>=2.1", "scipy>=1.9"]
plot = ["matplotlib>=3.5", "pandas>=1.5"]
quantum = [
  "openfermion>=1.5",
  "qiskit>=1.0",
  "qiskit-aer>=0.13",
  "qiskit-algorithms>=0.3",
]
notebooks = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py39", "py310"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
